name: Deploy pygbag to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pygbag pygame-ce

      - name: Build web bundle
        run: python -m pygbag --build .

      - name: Disable Jekyll (wasm-friendly static hosting)
        run: touch build/web/.nojekyll

      - name: Resumo do modo de deploy
        env:
          REPO: ${{ vars.USER_SITE_REPO }}
        run: |
          if [ -z "${REPO}" ]; then
            echo "::notice::USER_SITE_REPO vazio — deploy só via GitHub Pages deste repositório."
          else
            echo "::notice::USER_SITE_REPO definido (${REPO}) — push para ${REPO}/pinga-ana-adventure-demo/ neste mesmo job (sem artefacto entre jobs)."
          fi

      - name: Upload Pages artifact (só deploy do próprio repo)
        if: ${{ vars.USER_SITE_REPO == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: site_branch
        if: ${{ vars.USER_SITE_REPO != '' }}
        env:
          B: ${{ vars.USER_SITE_BRANCH }}
        run: |
          if [ -n "$B" ]; then echo "branch=$B" >> "$GITHUB_OUTPUT"
          else echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Exige secret USER_PAGES_TOKEN
        if: ${{ vars.USER_SITE_REPO != '' }}
        env:
          TOKEN: ${{ secrets.USER_PAGES_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::Define o secret USER_PAGES_TOKEN (PAT com push no repo indicado em USER_SITE_REPO). Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Push para ${{ vars.USER_SITE_REPO }}/pinga-ana-adventure-demo/
        if: ${{ vars.USER_SITE_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.USER_PAGES_TOKEN }}
          external_repository: ${{ vars.USER_SITE_REPO }}
          publish_branch: ${{ steps.site_branch.outputs.branch }}
          publish_dir: ./build/web
          destination_dir: pinga-ana-adventure-demo
          keep_files: true

  deploy-project-pages:
    needs: build
    if: ${{ vars.USER_SITE_REPO == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
